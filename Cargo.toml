[workspace]
resolver = "2"
members = ["crates/protocol-core", "crates/transport", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
repository = "https://github.com/drny85/ApexDiag"

[workspace.dependencies]
protocol-core = { path = "crates/protocol-core" }
transport = { path = "crates/transport" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "io-util"] }

[profile.release]
lto = true
codegen-units = 1

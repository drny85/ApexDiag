[package]
name = "transport"
description = "Hardware transport layer: BLE / Bluetooth serial, USB serial (K+DCAN) and DoIP"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
protocol-core.workspace = true
async-trait.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
btleplug = { version = "0.13", optional = true }
futures = { version = "0.3", optional = true }
uuid = { version = "1", optional = true }

[features]
default = []
# Bluetooth LE adapters through CoreBluetooth (macOS and iOS).
ble = ["dep:btleplug", "dep:futures", "dep:uuid"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

# Real adapters (btleplug, tokio-serial, DoIP over TcpStream) arrive in step 3,
# behind features, so the core can be tested on any machine without radios.
